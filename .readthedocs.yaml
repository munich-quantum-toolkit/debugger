version: 2

formats:
  - htmlzip

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  apt_packages:
    - cmake
    - doxygen
  jobs:
    pre_build:
      # Build the C++ API docs before Sphinx starts
      - cd docs && doxygen
      - cd docs && mkdir -p api/cpp && uv run --no-sync --no-dev breathe-apidoc -o api/cpp -m -f -g namespace doxygen/xml/

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
